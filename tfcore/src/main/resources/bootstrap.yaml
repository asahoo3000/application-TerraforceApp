spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: composite
  application:
    name: terraforce
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: ${DB_DRIVER_CLASSNAME:org.postgresql.Driver}
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/terraforce?useSSL=false}
    username: ${DB_USER_NAME:postgres}
    password: ${DB_USER_PASSWORD:ayushi123}
  jpa:
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
